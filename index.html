<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rosario Servicios Digitales • Tienda Oficial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07070a;
      --card-bg: #111217;
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-hover: rgba(229, 9, 20, 0.55);
      --red-rosario: #e50914;
      --neon-cyan: #00d2ff;
      --badge-tv: #e50914;
      --badge-cell: #00e676;
      --accent-yellow: #ffb703;
      --text-main: #ffffff;
      --text-muted: #8e8e93;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(229, 9, 20, 0.18) 0%, transparent 60%),
        radial-gradient(circle at 85% 30%, rgba(0, 210, 255, 0.08) 0%, transparent 45%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 18px 60px;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* HEADER */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 35px;
    }

    .brand-logo-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 35px rgba(229, 9, 20, 0.6), 0 0 10px rgba(255, 255, 255, 0.25);
      border: 2px solid rgba(255, 255, 255, 0.25);
      margin-bottom: 18px;
      background: #000;
      animation: floatLogo 4s ease-in-out infinite;
    }

    @keyframes floatLogo {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .sub-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 6px 18px;
      border-radius: 50px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #e4e4e7;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .sub-pill span {
      color: var(--red-rosario);
    }

    .section-title {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 0.5px;
      color: #ffffff;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 12px;
      justify-content: center;
    }

    .section-title svg {
      width: 26px;
      height: 26px;
      fill: var(--neon-cyan);
    }

    .section-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 6px;
      margin-bottom: 30px;
    }

    /* GUÍA DE INSTALACIÓN DOWNLOADER */
    .guide-box {
      background: linear-gradient(135deg, rgba(229, 9, 20, 0.08) 0%, rgba(0, 210, 255, 0.04) 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 35px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .guide-header {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 16px;
      color: #f43f5e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .guide-steps {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .step-item {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      padding: 16px;
    }

    .step-number {
      display: inline-block;
      width: 26px;
      height: 26px;
      background: var(--red-rosario);
      color: #fff;
      font-size: 13px;
      font-weight: 900;
      border-radius: 50%;
      text-align: center;
      line-height: 26px;
      margin-bottom: 10px;
    }

    .step-text h4 {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .step-text p {
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* GRILLA DE TARJETAS */
    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
      width: 100%;
    }

    .app-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .app-card:hover {
      transform: translateY(-5px);
      border-color: var(--card-border-hover);
      box-shadow: 0 18px 40px rgba(229, 9, 20, 0.25);
    }

    .card-banner {
      height: 155px;
      width: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .card-banner::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.1) 0%, var(--card-bg) 98%);
    }

    .banner-img-femon {
      height: 85px;
      width: 85px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
      z-index: 1;
    }

    .banner-graphic {
      font-size: 54px;
      z-index: 1;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5));
    }

    .device-badges {
      position: absolute;
      top: 14px;
      right: 14px;
      display: flex;
      gap: 6px;
      z-index: 2;
    }

    .badge-pill {
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      padding: 4px 9px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }

    .badge-tv {
      background: var(--badge-tv);
      color: #ffffff;
      box-shadow: 0 0 10px rgba(229, 9, 20, 0.5);
    }

    .badge-cell {
      background: var(--badge-cell);
      color: #000000;
      box-shadow: 0 0 10px rgba(0, 230, 118, 0.4);
    }

    .card-body {
      padding: 18px 22px 24px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      gap: 14px;
      z-index: 1;
    }

    .card-title {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.3px;
    }

    .card-desc {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.5;
      min-height: 42px;
    }

    .downloader-box {
      background: #171821;
      border: 1px dashed rgba(255, 255, 255, 0.16);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .downloader-box .lbl {
      font-size: 12px;
      font-weight: 700;
      color: #a1a1aa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .downloader-box .code {
      font-size: 19px;
      font-weight: 900;
      color: var(--accent-yellow);
      letter-spacing: 1.5px;
      font-family: monospace;
      background: rgba(229, 9, 20, 0.2);
      border: 1px solid rgba(229, 9, 20, 0.4);
      padding: 3px 10px;
      border-radius: 8px;
    }

    .downloader-box .code.muted {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.1);
      color: #71717a;
      font-size: 14px;
    }

    .btn-download {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: #000000;
      text-decoration: none;
      font-size: 14px;
      font-weight: 800;
      padding: 13px;
      border-radius: 12px;
      transition: all 0.2s;
      margin-top: 4px;
    }

      background: #e4e4e7;
      transform
